name: build
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v3.0.0-beta.rc1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: true
        type: boolean
        default: true
      draft:
        description: 'Mark as draft'
        required: true
        type: boolean
        default: false
      buildDaemon:
        description: 'Also build the airlinkd daemon binaries (TUI is built by default)'
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
            windows: false
            daemon: true
          - target: bun-linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            windows: false
          - target: bun-darwin-arm64
            runner: macos-latest
            platform: macos
            arch: arm64
            windows: false
          - target: bun-windows-x64
            runner: windows-latest
            platform: windows
            arch: x64
            windows: true
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install deps
        run: bun install --frozen-lockfile

      - name: install tui deps
        run: cd tui && bun install --frozen-lockfile

      - name: build tui binaries
        run: bun run build:tui

      - name: build daemon binaries (optional)
        if: matrix.daemon == true && github.event.inputs.buildDaemon == 'true'
        run: bun run build:daemon

      - name: zip binaries
        if: matrix.windows == false
        run: |
          cd dist
          zip airlinkd-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.event.inputs.version }}.zip airlinkd-*

      - name: zip binaries (windows)
        if: matrix.windows == true
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path airlinkd-* -DestinationPath airlinkd-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.event.inputs.version }}.zip

      - name: zip daemon binaries (optional)
        if: matrix.daemon == true && github.event.inputs.buildDaemon == 'true'
        run: |
          cd dist/daemon
          zip airlinkd-daemon-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.event.inputs.version }}.zip airlinkd-*

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: airlinkd-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.event.inputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: upload daemon artifact
        if: matrix.daemon == true && github.event.inputs.buildDaemon == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: airlinkd-daemon-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.event.inputs.version }}
          path: dist/daemon/*.zip
          if-no-files-found: error

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: list artifacts
        run: ls -lh dist/

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body: |
            ## AirlinkD ${{ github.event.inputs.version }}

            ### Binary (default)
            Self-contained binary — runs the TUI supervisor with no arguments (starts or adopts the daemon, live host/container stats, daemon logs) and the daemon itself when a command is passed:

            - `airlinkd` — TUI supervisor
            - `airlinkd start` — run the daemon
            - `airlinkd configure --panel <url> --key <key>` — configure the daemon

            | Platform | Architecture | Download |
            |----------|-------------|---------|
            | Linux | x64 | `airlinkd-linux-x64-${{ github.event.inputs.version }}.zip` |
            | Linux | arm64 | `airlinkd-linux-arm64-${{ github.event.inputs.version }}.zip` |
            | macOS | arm64 (Apple Silicon) | `airlinkd-macos-arm64-${{ github.event.inputs.version }}.zip` |
            | Windows | x64 | `airlinkd-windows-x64-${{ github.event.inputs.version }}.zip` |

            ### Daemon only (optional)
            Built when the `buildDaemon` input is enabled.

            | Platform | Architecture | Download |
            |----------|-------------|---------|
            | Linux | x64 | `airlinkd-daemon-linux-x64-${{ github.event.inputs.version }}.zip` |

            ### Changelog
            <!-- Add changelog notes here before publishing -->

            ### Notes
            <!-- Add any additional notes, breaking changes, or upgrade instructions here -->
          files: dist/*
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
